name: CI

on:
  push:
    branches: [main, feature/week-2, feature/week-3, feature/week-4, feature/week-5]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Unit tests
        run: |
          go test ./internal/... ./pkg/... \
            -v -count=1 -timeout 60s \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Show coverage
        run: go tool cover -func=coverage.out | grep total

      - name: Build API and Worker
        run: |
          go build ./cmd/api
          go build ./cmd/worker
