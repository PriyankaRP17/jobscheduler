services:

  mongo:
    image: mongo:7
    container_name: js_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobscheduler
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats:
    image: nats:latest
    container_name: js_nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

volumes:
  mongo_data:
  nats_data:
